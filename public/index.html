function pageDashboard(){
  const{year:y,month:m,monthEnd:mEnd,rangeMode,scope,dept,cat}=S.dash;
  const m1=m, m2=rangeMode&&mEnd>=m?mEnd:m;
  const isRange=rangeMode&&m2>m1;

  // Ambil data sesuai mode
  let sales,salesLY,damage,missingMonths=[];
  if(isRange){
    const sr=Store.getSalesRange(y,m1,m2); sales=sr.rows; missingMonths=sr.missing;
    salesLY=Store.getSalesRange(y-1,m1,m2).rows;
    damage=Store.getDamageRange(y,m1,m2);
  } else {
    sales=Store.getSales(y,m1);
    salesLY=Store.getSales(y-1,m1);
    damage=Store.getDamage(y,m1);
  }
  const lyMap=salesLY.reduce((a,b)=>{a[`${b.department_code}__${b.sku}`]=b;return a;},{});
  const fd=scope==='department'||scope==='category'?dept:'';
  const fc=scope==='category'?cat:'';
  const periodLbl=isRange?`${MSHORT[m1-1]}–${MSHORT[m2-1]} ${y}`:`${MONTHS[m1-1]} ${y}`;

  // Trend chart selalu per bulan (bukan range)
  const trendTY=MSHORT.map((_,i)=>Store.getSales(y,i+1).reduce((a,b)=>a+Number(b.sales||0),0)||null);
  const trendLY=MSHORT.map((_,i)=>Store.getSales(y-1,i+1).reduce((a,b)=>a+Number(b.sales||0),0)||null);

  const deptChart=DCODES.map(code=>({
    lbl:DEPTS[code].split(' ')[0],
    val:sales.filter(r=>r.department_code===code).reduce((a,b)=>a+Number(b.sales||0),0)
  })).filter(d=>d.val>0).sort((a,b)=>b.val-a.val).slice(0,8);

  const negRows=sales.filter(r=>{const l=lyMap[`${r.department_code}__${r.sku}`];return l&&Number(r.sales)<Number(l.sales);});
  const negGap=negRows.reduce((a,r)=>{const l=lyMap[`${r.department_code}__${r.sku}`];return a+(Number(r.sales)-Number(l.sales));},0);

  const dmgByDept=DCODES.map(c=>{const dr=damage.filter(r=>r.department_code===c);return{c,n:DEPTS[c],cost:dr.reduce((a,b)=>a+Number(b.total_cost||0),0)};}).filter(d=>d.cost>0).sort((a,b)=>b.cost-a.cost).slice(0,6);
  const totalDmg=damage.reduce((a,b)=>a+Number(b.total_cost||0),0);

  const adepts=[...new Set(sales.map(r=>r.department_code))].sort();
  const acats=[...new Set((dept?sales.filter(r=>r.department_code===dept):sales).map(r=>r.category).filter(Boolean))].sort();

  // Range selector HTML
  const rangeToggle=`
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div class="stabs" style="margin-bottom:0">
        <div class="stab${!rangeMode?' on':''}" data-dash-range="0">Bulanan</div>
        <div class="stab${rangeMode?' on':''}" data-dash-range="1">Range</div>
      </div>
      ${rangeMode?`
        <select class="sel" data-dash-m1 style="min-width:110px">
          ${MONTHS.map((mn,i)=>`<option value="${i+1}"${i+1===m1?' selected':''}>${mn}</option>`).join('')}
        </select>
        <span style="color:var(--tm);font-size:12px">s/d</span>
        <select class="sel" data-dash-m2 style="min-width:110px">
          ${MONTHS.map((mn,i)=>`<option value="${i+1}"${i+1===m2?' selected':''}>${mn}</option>`).join('')}
        </select>
        <select class="sel" data-dash-year style="min-width:90px">
          ${[2025,2026,2027,2028,2029,2030].map(yr=>`<option value="${yr}"${yr===y?' selected':''}>${yr}</option>`).join('')}
        </select>
      `:periodBar(y,m1,'dash')}
    </div>`;

  return`
    <div class="ptitle">Dashboard</div>
    <div class="pdesc">Hypermart 284 Ambon City Center — Performa ${periodLbl}</div>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px">
      ${rangeToggle}
    </div>
    ${missingMonths.length?`<div style="background:rgba(217,119,6,.08);border:1px solid rgba(217,119,6,.25);border-radius:8px;padding:10px 16px;font-size:12px;color:var(--amber);margin-bottom:12px;display:flex;align-items:center;gap:8px">
      ⚠️ Data belum tersedia untuk: <strong>${missingMonths.join(', ')}</strong> — KPI dihitung dari bulan yang ada saja.
    </div>`:''}
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">
      ${scopeTabs(scope,'dash')}
      ${scope!=='store'?`<select class="sel" data-dash-dept>
        <option value="">All Departments</option>
        ${adepts.map(c=>`<option value="${c}"${c===dept?' selected':''}>${c} — ${DEPTS[c]}</option>`).join('')}
      </select>`:''}
      ${scope==='category'&&dept?`<select class="sel" data-dash-cat>
        <option value="">All Categories</option>
        ${acats.map(c=>`<option value="${c}"${c===cat?' selected':''}>${c}</option>`).join('')}
      </select>`:''}
      ${dept||cat?`<div style="font-size:12px;color:var(--tm)">${[dept&&DEPTS[dept],cat].filter(Boolean).join(' › ')}</div>`:''}
    </div>
    ${kpiGrid(y,m1,fd,fc,m2,isRange,sales,salesLY,damage)}
    <div class="chartgrid" style="margin-bottom:16px">
      <div class="panel">
        <div class="ph"><div class="ptl">Monthly Sales Trend</div><span style="font-size:11px;color:var(--tm)">${y} vs ${y-1}</span></div>
        ${lineChart([{name:`TY ${y}`,data:trendTY},{name:`LY ${y-1}`,data:trendLY}],MSHORT,150)}
      </div>
      <div class="panel">
        <div class="ph"><div class="ptl">Sales by Department</div><span style="font-size:11px;color:var(--tm)">${periodLbl}</span></div>
        ${barChart(deptChart)}
      </div>
    </div>
    <div class="grid2" style="margin-bottom:16px">
      <div class="panel">
        <div class="ph"><div class="ptl">Top 10 SKU</div><span class="badge bb">${periodLbl}</span></div>
        ${topSkuTable(y,m1,fd,fc,'top',10)}
      </div>
      <div class="panel">
        <div class="ph"><div class="ptl">Lowest 10 SKU</div><span class="badge br">${periodLbl}</span></div>
        ${topSkuTable(y,m1,fd,fc,'lowest',10)}
      </div>
    </div>
    <div class="grid2" style="margin-bottom:16px">
      <div class="panel">
        <div class="ph"><div class="ptl">SKU Minus Growth</div><span class="badge br">${negRows.length} SKU turun vs LY</span></div>
        ${negRows.length===0
          ?`<div class="empty" style="padding:20px"><div class="etitle" style="color:var(--green)">✓ Tidak ada SKU minus growth</div></div>`
          :`<div class="srow"><span class="sl">SKU minus growth</span><span class="sv gneg">${negRows.length}</span></div>
            <div class="srow"><span class="sl">Total gap vs LY</span><span class="sv gneg">${fRp(negGap)}</span></div>
            ${DCODES.map(c=>{const g=sales.filter(r=>r.department_code===c).reduce((a,r)=>{const l=lyMap[`${r.department_code}__${r.sku}`];const gap=Number(r.sales)-(l?Number(l.sales):0);return gap<0?a+gap:a;},0);return g?`<div style="display:flex;justify-content:space-between;font-size:11px;padding:4px 20px;border-bottom:1px solid var(--bd2)"><span style="color:var(--t2)">${c} ${DEPTS[c]}</span><span class="gneg">${fRp(g)}</span></div>`:'';}).join('')}`}
      </div>
      <div class="panel">
        <div class="ph"><div class="ptl">Damage Summary</div><span class="badge by">${periodLbl}</span></div>
        ${dmgByDept.length===0
          ?`<div class="empty" style="padding:20px"><div class="etitle">No Damage Data</div></div>`
          :`${dmgByDept.map(d=>`<div class="srow"><span class="sl">${d.c} ${d.n}</span><span class="sv gneg">${fRp(d.cost)}</span></div>`).join('')}
            <div style="padding:10px 20px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;font-size:12px">
              <span style="font-weight:600;color:var(--t2)">Total Damage Cost</span>
              <span class="gneg" style="font-weight:600">${fRp(totalDmg)}</span>
            </div>`}
      </div>
    </div>
    <div class="panel">
      <div class="ph">
        <div class="ptl">Performa per Department — ${periodLbl}</div>
        <span style="font-size:11px;color:var(--tm)">Dengan grouping divisi</span>
      </div>
      ${deptTable(y,m1,m2,S.dash.dsort||'ty',S.dash.ddir||-1,true,missingMonths)}
    </div>`;
}

function pageSales(){
  const{year:y,month:m,dept,q,sort,dir,pg,view}=S.sales;
  const PER=20;
  const sales=Store.getSales(y,m),salesLY=Store.getSales(y-1,m);
  const damage=Store.getDamage(y,m);

  // Build damage map: dept__sku -> total_cost, qty
  const dmgMap=damage.reduce((a,b)=>{
    const key=`${b.department_code}__${b.sku}`;
    if(!a[key])a[key]={total_cost:0,qty:0};
    a[key].total_cost+=Number(b.total_cost||0);
    a[key].qty+=Number(b.qty||0);
    return a;
  },{});

  // Build maps
  const tyMap=sales.reduce((a,b)=>{a[`${b.department_code}__${b.sku}`]=b;return a;},{});
  const lyMap=salesLY.reduce((a,b)=>{a[`${b.department_code}__${b.sku}`]=b;return a;},{});

  // All SKU keys: union of TY and LY
  const allKeys=new Set([...Object.keys(tyMap),...Object.keys(lyMap)]);
  const adepts=[...new Set([...sales,...salesLY].map(r=>r.department_code))].sort();

  // Build full row list
  const allRows=[...allKeys].map(key=>{
    const ty=tyMap[key],ly=lyMap[key];
    const base=ty||ly;
    const tySales=ty?Number(ty.sales||0):0;
    const tyQty=ty?Number(ty.qty||0):0;
    const lySales=ly?Number(ly.sales||0):0;
    const g=growth(tySales,lySales);
    const status=!ty?'ly_only':!ly?'ty_only':'both';
    const dmg=dmgMap[key];
    const dmgCost=dmg?Number(dmg.total_cost)||0:0;
    // FIX: dmg_pct = damage cost / TY sales * 100, hanya jika tySales > 0 dan dmgCost > 0
    // Hasil dijaga agar tidak NaN/Infinity
    const dmgPct=(tySales>0&&dmgCost>0)?Math.min(((dmgCost/tySales)*100),999):0;
    return{department_code:base.department_code,sku:base.sku,description:base.description,
      category:base.category||'',sales:tySales,qty:tyQty,ly_sales:lySales,g,status,
      dmg_cost:dmgCost,dmg_qty:dmg?Number(dmg.qty)||0:0,dmg_pct:dmgPct};
  });

  // Filter by dept and search
  const deptFilter=r=>dept==='all'||r.department_code===dept;
  const qFilter=r=>!q||r.sku.toLowerCase().includes(q.toLowerCase())||(r.description||'').toLowerCase().includes(q.toLowerCase());

  // View: 'all' = TY rows, 'missing' = ly_only only
  const viewRows=allRows.filter(r=>
    deptFilter(r)&&qFilter(r)&&
    (view==='missing'?r.status==='ly_only':r.status!=='ly_only')
  );

  // Counts for badges
  const lyOnlyCount=allRows.filter(r=>deptFilter(r)&&r.status==='ly_only').length;
  const tyOnlyCount=allRows.filter(r=>deptFilter(r)&&r.status==='ty_only').length;

  const sorted=[...viewRows].sort((a,b)=>{
    const va=sort==='sku'?(a.sku||''):sort==='g'?(a.g.pct??-Infinity):Number(a[sort]||0);
    const vb=sort==='sku'?(b.sku||''):sort==='g'?(b.g.pct??-Infinity):Number(b[sort]||0);
    return(va<vb?-1:va>vb?1:0)*dir;
  });
  const total=sorted.length,pages=Math.ceil(total/PER),pg2=Math.min(pg,pages||1);
  const pageR=sorted.slice((pg2-1)*PER,pg2*PER);

  function th(col,lbl,right=false){
    const on=sort===col;
    return`<th data-sort-sales="${col}" style="cursor:pointer${right?';text-align:right':''}">${lbl}${on?(dir>0?' ↑':' ↓'):''}</th>`;
  }

  const hasDmgData=damage.length>0;

  // Table header
  const thead=view==='missing'
    ? `<tr><th>SKU</th><th>Description</th><th>Dept</th><th>Category</th>${th('ly_sales','LY Sales',true)}<th style="text-align:right">LY Qty</th></tr>`
    : `<tr>${th('sku','SKU')}<th>Description</th><th>Dept</th><th>Category</th>
        ${th('sales','TY Sales',true)}${th('qty','TY Qty',true)}${th('ly_sales','LY Sales',true)}${th('g','Growth')}
        ${hasDmgData?`${th('dmg_cost','Damage Cost',true)}${th('dmg_pct','% Dmg/Sales',true)}`:''}
      </tr>`;

  const tbody=view==='missing'
    ? pageR.map(r=>`<tr>
        <td class="mono">${esc(r.sku)}</td>
        <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis">${esc(r.description||'—')}</td>
        <td><span class="badge bb" style="font-size:9px">${r.department_code}</span></td>
        <td style="font-size:12px;color:var(--t2)">${esc(r.category||'—')}</td>
        <td class="num gneg">${fRp(r.ly_sales)}</td>
        <td class="num" style="color:var(--tm)">${fNum(lyMap[`${r.department_code}__${r.sku}`]?.qty||0)}</td>
      </tr>`).join('')
    : pageR.map(r=>`<tr>
        <td class="mono">${esc(r.sku)}</td>
        <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis">${esc(r.description||'—')}</td>
        <td><span class="badge bb" style="font-size:9px">${r.department_code}</span></td>
        <td style="font-size:12px;color:var(--t2)">${esc(r.category||'—')}</td>
        <td class="num">${fRp(r.sales)}</td>
        <td class="num">${fNum(r.qty)||'—'}</td>
        <td class="num" style="color:var(--tm)">${r.ly_sales?fRp(r.ly_sales):'—'}</td>
        <td class="num ${r.g.cls}">${r.g.lbl}</td>
        ${hasDmgData?`
        <td class="num ${r.dmg_cost>0?'gneg':''}">${r.dmg_cost>0?fRp(r.dmg_cost):'—'}</td>
        <td class="num" style="${r.dmg_pct>5?'color:var(--red);font-weight:700':r.dmg_pct>2?'color:var(--amber);font-weight:600':''}">${r.dmg_pct>0?r.dmg_pct.toFixed(2)+'%':'—'}</td>`:''}
      </tr>`).join('');

  return`
    <div class="ptitle">Sales Analysis</div>
    <div class="pdesc">SKU performance ${MONTHS[m-1]} ${y} vs ${y-1}${hasDmgData?' — termasuk data damage per SKU':''}</div>
    ${periodBar(y,m,'sales')}
    <div class="toolbar">
      <input class="searchbar" placeholder="Search SKU or description…" value="${esc(q)}" id="salesQ"/>
      <select class="sel" data-sales-dept>
        <option value="all">All Departments</option>
        ${adepts.map(c=>`<option value="${c}"${c===dept?' selected':''}>${c} — ${DEPTS[c]||c}</option>`).join('')}
      </select>
    </div>

    <div class="utabs" style="margin-bottom:0">
      <div class="utab${view==='all'?' on':''}" data-sales-view="all">
        Semua SKU TY ${y}
        ${tyOnlyCount?`<span class="badge bg" style="font-size:9px;margin-left:4px">${tyOnlyCount} baru</span>`:''}
      </div>
      <div class="utab${view==='missing'?' on':''}" data-sales-view="missing">
        SKU Hilang di TY
        ${lyOnlyCount?`<span class="badge br" style="font-size:9px;margin-left:4px">${lyOnlyCount}</span>`:''}
      </div>
    </div>

    <div class="panel" style="border-top-left-radius:0;border-top-right-radius:0;border-top:none">
      ${view==='missing'&&lyOnlyCount===0
        ?`<div class="empty"><div class="etitle" style="color:var(--green)">✓ Tidak ada SKU hilang</div><div class="esub">Semua SKU LY ${y-1} masih ada di TY ${y}.</div></div>`
        :!sorted.length
          ?`<div class="empty"><div class="etitle">${q?'Tidak ada hasil pencarian':'Tidak ada data'}</div></div>`
          :`${sortBar(
              view==='missing'
                ? [{k:'ly_sales',l:'LY Sales'},{k:'sku',l:'SKU'}]
                : [{k:'sales',l:'TY Sales'},{k:'qty',l:'TY Qty'},{k:'ly_sales',l:'LY Sales'},{k:'g',l:'Growth'},{k:'dmg_cost',l:'Damage Cost'},{k:'dmg_pct',l:'% Dmg'}],
              sort, dir, 'sort-sales'
            )}
            <div class="ph" style="padding:10px 16px">
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                <span style="font-size:11px;color:var(--tm)">${total.toLocaleString('id')} SKU${view==='missing'?` ada di LY ${y-1} tapi tidak ada di TY ${y}`:''}</span>
                ${view==='missing'?`<span style="font-size:11px;color:var(--tm)">Total LY Sales hilang: <strong class="gneg">${fRp(viewRows.reduce((a,r)=>a+r.ly_sales,0))}</strong></span>`:''}
                ${hasDmgData&&view==='all'?`<span class="badge by" style="font-size:9px">📦 Damage: ${fRp(viewRows.reduce((a,r)=>a+r.dmg_cost,0))}</span>`:''}
              </div>
              ${total>0?`<button class="btn btn-sm btn-s" id="exportSales">⬇ Export</button>`:''}
            </div>
            <div class="twrap"><table class="tbl">
              <thead>${thead}</thead>
              <tbody>${tbody}</tbody>
            </table></div>
            ${pages>1?`<div class="pagi">

function pageNegative(){

    const l=lyMap[`${r.department_code}__${r.sku}`];

    if(gap>=0)return null;
    return{...r,ly_sales:l.sales,sales_gap:gap,g:growth(r.sales,l.sales)};

        </div>
      </div>

        :`${sortBar([{k:'sales_gap',l:'Sales Gap'},{k:'sales',l:'TY Sales'},{k:'ly_sales',l:'LY Sales'},{k:'g',l:'Growth %'}],sort,dir,'sort-neg')}
        <div class="twrap"><table class="tbl">

function pageSku(){
  const{year:y,month:m,q,sel}=S.sku;
  const sales=Store.getSales(y,m);
  const salesLY=Store.getSales(y-1,m);
  const damage=Store.getDamage(y,m);
  const filtered=q.length>=2?sales.filter(r=>r.sku.toLowerCase().includes(q.toLowerCase())||(r.description||'').toLowerCase().includes(q.toLowerCase())).slice(0,30):[];
  let detail=[];
  let selLY=null,selDmg=null,selDmgHistory=[];
  if(sel){
    selLY=salesLY.find(r=>r.sku===sel.sku&&r.department_code===sel.department_code)||null;
    selDmg=damage.filter(r=>r.sku===sel.sku&&r.department_code===sel.department_code).reduce((a,b)=>({qty:a.qty+Number(b.qty||0),total_cost:a.total_cost+Number(b.total_cost||0)}),{qty:0,total_cost:0});
    for(let mo=1;mo<=12;mo++){
      const s=Store.getSales(y,mo),sLY=Store.getSales(y-1,mo),sd=Store.getDamage(y,mo);
      const row=s.find(r=>r.sku===sel.sku&&r.department_code===sel.department_code);
      const rowLY=sLY.find(r=>r.sku===sel.sku&&r.department_code===sel.department_code);
      const rowDmg=sd.filter(r=>r.sku===sel.sku&&r.department_code===sel.department_code).reduce((a,b)=>a+Number(b.total_cost||0),0);
      detail.push({ty:row?.sales||null,ly:rowLY?.sales||null,dmg:rowDmg||null});
      selDmgHistory.push(rowDmg||null);
    }
    // Growth calc
    const tySales=Number(sel.sales||0);
    const lySales=selLY?Number(selLY.sales||0):0;
    sel._ly=lySales;
    sel._g=growth(tySales,lySales);

      ?`<div class="alert-i">ℹ Ketik minimal 2 karakter untuk mencari SKU</div>`

        ?`<div class="empty"><div class="empty-icon">🔍</div><div class="etitle">SKU tidak ditemukan</div><div class="esub">Coba dengan kode atau nama produk yang berbeda</div></div>`

          <div class="twrap"><table class="tbl">

              const ly=salesLY.find(l=>l.sku===r.sku&&l.department_code===r.department_code);
              const g=growth(Number(r.sales||0),ly?Number(ly.sales||0):0);
              return`<tr>
                <td class="mono">${esc(r.sku)}</td>

// ---- CATEGORY ANALYSIS ----
function pageCategory(){
  const{year:y,month:m,dept}=S.cat;
  const sales=Store.getSales(y,m);
  const salesLY=Store.getSales(y-1,m);
  const damage=Store.getDamage(y,m);
  const adepts=[...new Set(sales.map(r=>r.department_code))].sort();
  const filtered=dept==='all'?sales:sales.filter(r=>r.department_code===dept);
  const filteredLY=dept==='all'?salesLY:salesLY.filter(r=>r.department_code===dept);
  const filteredDmg=dept==='all'?damage:damage.filter(r=>r.department_code===dept);

  // Group by category
  const catMap={};
  filtered.forEach(r=>{
    const cat=r.category||'Uncategorized';
    if(!catMap[cat])catMap[cat]={cat,ty:0,qty:0,skus:new Set(),dmg:0};
    catMap[cat].ty+=Number(r.sales||0);
    catMap[cat].qty+=Number(r.qty||0);
    catMap[cat].skus.add(r.sku);
  });
  filteredLY.forEach(r=>{
    const cat=r.category||'Uncategorized';
    if(!catMap[cat])catMap[cat]={cat,ty:0,qty:0,skus:new Set(),dmg:0};
    if(!catMap[cat].ly)catMap[cat].ly=0;
    catMap[cat].ly+=Number(r.sales||0);
  });
  filteredDmg.forEach(r=>{
    const cat=r.category||'Uncategorized';
    if(catMap[cat])catMap[cat].dmg+=Number(r.total_cost||0);
  });

  const cats=Object.values(catMap).map(c=>({...c,skus:c.skus.size,ly:c.ly||0,g:growth(c.ty,c.ly||0)}))
    .sort((a,b)=>b.ty-a.ty);
  const totTY=cats.reduce((a,c)=>a+c.ty,0);

  return`
    <div class="ptitle">Category Analysis</div>
    <div class="pdesc">Analisa sales per kategori produk — ${MONTHS[m-1]} ${y} vs ${y-1}</div>
    ${periodBar(y,m,'cat')}
    <div class="toolbar">
      <select class="sel" data-cat-dept>
        <option value="all">All Departments</option>
        ${adepts.map(c=>`<option value="${c}"${c===dept?' selected':''}>${c} — ${DEPTS[c]||c}</option>`).join('')}
      </select>
    </div>
    ${!cats.length?`<div class="empty"><div class="etitle">Tidak ada data</div></div>`:`
    <div class="panel" style="margin-bottom:16px">
      <div class="ph"><div class="ptl">Sales per Category — ${MONTHS[m-1]} ${y}</div><span class="badge bb">${cats.length} kategori</span></div>
      <div class="twrap"><table class="tbl">
        <thead><tr>
          <th>#</th><th>Category</th>
          <th style="text-align:right">TY Sales</th>
          <th style="text-align:right">% of Total</th>
          <th style="text-align:right">LY Sales</th>
          <th style="text-align:right">Growth</th>
          <th style="text-align:right">Qty</th>
          <th style="text-align:right">SKU Count</th>
          <th style="text-align:right">Damage Cost</th>
          <th style="text-align:right">% Dmg</th>
        </tr></thead>
        <tbody>${cats.map((c,i)=>{
          const pct=totTY>0?((c.ty/totTY)*100).toFixed(1):0;
          const dmgPct=c.ty>0&&c.dmg>0?((c.dmg/c.ty)*100).toFixed(2):null;
          return`<tr>
            <td><span class="rank">${i+1}</span></td>
            <td style="font-weight:600">${esc(c.cat)}</td>
            <td class="num">${fRp(c.ty)}</td>
            <td class="num">
              <div style="display:flex;align-items:center;gap:6px;justify-content:flex-end">
                <span>${pct}%</span>
                <div style="width:50px;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden">
                  <div style="width:${pct}%;height:100%;background:var(--blue);border-radius:3px"></div>
                </div>
              </div>
            </td>
            <td class="num" style="color:var(--tm)">${c.ly?fRp(c.ly):'—'}</td>
            <td class="num ${c.g.cls}">${c.g.lbl}</td>
            <td class="num">${fNum(c.qty)}</td>
            <td class="num">${c.skus}</td>
            <td class="num ${c.dmg>0?'gneg':''}">${c.dmg>0?fRp(c.dmg):'—'}</td>
            <td class="num" style="${dmgPct>5?'color:var(--red);font-weight:700':dmgPct>2?'color:var(--amber)':''}">${dmgPct!==null?dmgPct+'%':'—'}</td>
          </tr>`;
        }).join('')}</tbody>
        <tfoot><tr style="font-weight:700;background:var(--bg3)">
          <td colspan="2" style="padding:10px 14px;font-size:12px">TOTAL</td>
          <td class="num" style="font-weight:700">${fRp(totTY)}</td>
          <td class="num">100%</td>
          <td class="num" style="color:var(--tm)">${fRp(cats.reduce((a,c)=>a+c.ly,0))}</td>
          <td class="num ${growth(totTY,cats.reduce((a,c)=>a+c.ly,0)).cls}">${growth(totTY,cats.reduce((a,c)=>a+c.ly,0)).lbl}</td>
          <td class="num">${fNum(cats.reduce((a,c)=>a+c.qty,0))}</td>
          <td class="num">${cats.reduce((a,c)=>a+c.skus,0)}</td>
          <td class="num gneg">${fRp(cats.reduce((a,c)=>a+c.dmg,0))}</td>
          <td></td>
        </tr></tfoot>
      </table></div>
    </div>
    <div class="chartgrid" style="margin-bottom:0">
      <div class="panel">
        <div class="ph"><div class="ptl">Top Category by Sales</div><span style="font-size:11px;color:var(--tm)">Bar Chart</span></div>
        ${barChart(cats.slice(0,10).map(c=>({lbl:c.cat.length>14?c.cat.slice(0,12)+'…':c.cat,val:c.ty})),{})}
      </div>
      <div class="panel">
        <div class="ph"><div class="ptl">Distribusi Sales per Category</div><span style="font-size:11px;color:var(--tm)">Donut Chart</span></div>
        ${donutChart(cats.slice(0,10).map(c=>({lbl:c.cat,val:c.ty})))}
      </div>
    </div>
    `}`;
}

// ---- BUDGET VS ACTUAL ----
function pageBudget(){
  const{year:y,month:m}=S.budg;
  const sales=Store.getSales(y,m);
  const budgets=Store.getBudget(y,m);
  const budgMap=budgets.reduce((a,b)=>{a[b.department_code]=Number(b.budget_amount||0);return a;},{});

  const rows=DCODES.map(code=>{
    const ty=sales.filter(r=>r.department_code===code).reduce((a,r)=>a+Number(r.sales||0),0);
    const budg=budgMap[code]||0;
    const gap=ty-budg;
    const ach=budg>0?((ty/budg)*100):null;
    return{code,name:DEPTS[code],ty,budg,gap,ach};
  }).filter(r=>r.ty>0||r.budg>0).sort((a,b)=>b.budg-a.budg);

  const totTY=rows.reduce((a,r)=>a+r.ty,0);
  const totBudg=rows.reduce((a,r)=>a+r.budg,0);
  const totGap=totTY-totBudg;
  const totAch=totBudg>0?((totTY/totBudg)*100):null;

  const hasBudget=budgets.length>0;

  return`
    <div class="ptitle">Budget vs Actual</div>
    <div class="pdesc">Perbandingan realisasi sales vs budget per department — ${MONTHS[m-1]} ${y}</div>
    ${periodBar(y,m,'budg')}
    ${!hasBudget?`<div class="alert-i">ℹ Belum ada data budget untuk periode ini. Upload budget di halaman Data Upload → tab Budget.</div>`:''}
    <div class="kgrid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
      <div class="kcard"><div class="klbl">Total Budget</div><div class="kval">${fRp(totBudg)}</div><div class="ksub">${totBudg?fRpFull(totBudg):'Belum ada budget'}</div></div>
      <div class="kcard"><div class="klbl">Total Actual (TY)</div><div class="kval">${fRp(totTY)}</div></div>
      <div class="kcard"><div class="klbl">Achievement</div><div class="kval ${totAch>=100?'gpos':totAch>=80?'':' gneg'}">${totAch!==null?totAch.toFixed(1)+'%':'—'}</div></div>
      <div class="kcard"><div class="klbl">Gap vs Budget</div><div class="kval ${totGap>=0?'gpos':'gneg'}">${totGap>=0?'+':''}${fRp(totGap)}</div></div>
    </div>
    <div class="panel">
      <div class="ph"><div class="ptl">Budget vs Actual per Department</div><span class="badge ${totAch>=100?'bg':totAch>=80?'by':'br'}">${totAch!==null?totAch.toFixed(1)+'% achievement':'No budget'}</span></div>
      ${!rows.length?`<div class="empty"><div class="etitle">Tidak ada data</div></div>`:`
      <div class="twrap"><table class="tbl">
        <thead><tr>
          <th>Code</th><th>Department</th>
          <th style="text-align:right">Budget</th>
          <th style="text-align:right">Actual (TY)</th>
          <th style="text-align:right">Gap</th>
          <th style="text-align:right">Achievement</th>
          <th style="text-align:right">Progress</th>
        </tr></thead>
        <tbody>${rows.map(r=>{
          const achPct=r.ach!==null?Math.min(r.ach,150):0;
          const achColor=r.ach>=100?'var(--green)':r.ach>=80?'var(--amber)':'var(--red)';
          return`<tr>
            <td class="mono">${r.code}</td>
            <td style="font-weight:600">${esc(r.name)}</td>
            <td class="num" style="color:var(--tm)">${r.budg?fRp(r.budg):'—'}</td>
            <td class="num">${fRp(r.ty)}</td>
            <td class="num ${r.gap>=0?'gpos':'gneg'}">${r.gap>=0?'+':''}${fRp(r.gap)}</td>
            <td class="num" style="font-weight:700;color:${r.ach>=100?'var(--green)':r.ach>=80?'var(--amber)':'var(--red)'}">${r.ach!==null?r.ach.toFixed(1)+'%':r.budg?'0%':'—'}</td>
            <td style="min-width:100px;padding:10px 14px">
              <div style="background:var(--bg3);border-radius:4px;height:8px;overflow:hidden">
                <div style="width:${Math.min(achPct,100)}%;height:100%;background:${achColor};border-radius:4px;transition:width .4s"></div>
              </div>
            </td>
          </tr>`;
        }).join('')}</tbody>
        <tfoot><tr style="font-weight:800;background:var(--bg3)">
          <td colspan="2" style="padding:10px 14px;font-size:12px">TOTAL STORE</td>
          <td class="num" style="font-weight:700">${fRp(totBudg)}</td>
          <td class="num" style="font-weight:700">${fRp(totTY)}</td>
          <td class="num ${totGap>=0?'gpos':'gneg'}" style="font-weight:700">${totGap>=0?'+':''}${fRp(totGap)}</td>
          <td class="num" style="font-weight:800;color:${totAch>=100?'var(--green)':totAch>=80?'var(--amber)':'var(--red)'}">${totAch!==null?totAch.toFixed(1)+'%':'—'}</td>
          <td></td>
        </tr></tfoot>
      </table></div>`}
    </div>
    ${rows.length>0?`
    <div class="panel" style="margin-top:16px">
      <div class="ph"><div class="ptl">Budget vs Actual — Visualisasi</div><span style="font-size:11px;color:var(--tm)">${MONTHS[m-1]} ${y}</span></div>
      ${groupedBarChart(rows.filter(r=>r.budg>0||r.ty>0).map(r=>({
        lbl:r.code,
        budget:r.budg,
        actual:r.ty,
      })))}
    </div>`:''}`;
}

create table if not exists hm_sales (
  id bigserial primary key,
  year int not null, month int not null,
  department_code text, sku text, description text,
  category text, sales numeric, qty numeric,
  created_at timestamptz default now()

  category text, budget_amount numeric,
  created_at timestamptz default now()
);
create table if not exists hm_damage (

  department_code text, sku text, description text,
  category text, qty numeric, total_cost numeric,
  created_at timestamptz default now()
);

create index if not exists idx_hm_budget_period on hm_budget(year,month);
create index if not exists idx_hm_damage_period on hm_damage(year,month);
-- Enable RLS (opsional, bisa dimatikan untuk internal use)
alter table hm_sales enable row level security;
alter table hm_budget enable row level security;
alter table hm_damage enable row level security;
-- Policy: izinkan semua operasi via anon key
create policy "allow_all_hm_sales" on hm_sales for all using (true) with check (true);
create policy "allow_all_hm_budget" on hm_budget for all using (true) with check (true);
create policy "allow_all_hm_damage" on hm_damage for all using (true) with check (true);</pre>

                <select class="sel" id="sbPullType" style="min-width:100px"><option value="sales">Sales</option><option value="budget">Budget</option><option value="damage">Damage</option></select>
                <select class="sel" id="sbPullYear" style="min-width:80px">${years.map(y=>`<option value="${y}"${y===new Date().getFullYear()?' selected':''}>${y}</option>`).join('')}</select>
                <select class="sel" id="sbPullMonth" style="min-width:110px">${MONTHS.map((m,i)=>`<option value="${i+1}"${i+1===new Date().getMonth()+1?' selected':''}>${m}</option>`).join('')}</select>
                <button class="btn btn-s btn-sm" id="sbDoPull">⬇ Pull</button>
              </div>

            <hr class="divider"/>
            <div>
              <div class="fl" style="margin-bottom:6px">🔄 Full Sync Satu Tahun</div>
              <div style="font-size:12px;color:var(--tm);margin-bottom:10px">Push SEMUA data Sales + Budget + Damage satu tahun dari lokal ke Supabase sekaligus.</div>
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                <select class="sel" id="sbFullSyncYear" style="min-width:80px">${years.map(y=>`<option value="${y}"${y===new Date().getFullYear()?' selected':''}>${y}</option>`).join('')}</select>
                <button class="btn btn-p btn-sm" id="sbDoFullSync">🚀 Full Sync Tahun Ini</button>
              </div>
            </div>`}
          </div>
        </div>
      </div>
      <div class="panel" style="margin-bottom:0">
        <div class="ph"><div class="ptl">📋 Sync Log</div><span class="badge bb">${sbLog.length} entri</span></div>

          <div style="max-height:200px;overflow-y:auto">
            ${sbLog.map(l=>`<div style="display:flex;gap:12px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:12px">
              <span style="color:var(--tm);white-space:nowrap;font-size:10px">${new Date(l.ts).toLocaleTimeString('id-ID')}</span>
              <span style="color:${l.ok?'var(--t2)':'var(--red)'}">${esc(l.msg)}</span>
            </div>`).join('')}
          </div>`}
        </div>
      </div>`;
    })():''}
  `;
}

function render(){
  if(!S.user) return pageLogin();
  const pages={dashboard:pageDashboard,sales:pageSales,sku:pageSku,negative:pageNegative,damage:pageDamage,category:pageCategory,budget:pageBudget,report:pageReport,upload:pageUpload,history:pageHistory,departments:pageDepartments,settings:pageSettings};
  const pageHtml=(pages[S.page]||pageDashboard)();
  const navInfo=NAV.find(n=>n.id===S.page)||NAV[0];
  return`
    ${sidebarHtml()}
    <div class="drawer${S.mopen?' open':''}" id="drawerOverlay">
      ${sidebarHtml(true)}
    </div>

// ---- EXCEL PARSER ----
function normK(o){const r={};Object.entries(o).forEach(([k,v])=>{r[k.trim().toUpperCase().replace(/\s+/g,'_')]=v;});return r;}
function parseXlsx(file){
  // Helper: try to repair embedded XLSX, or load from CDN as fallback
  function ensureXLSX(){
    return new Promise((resolve,reject)=>{
      // 1) Embedded library already OK?
      if(typeof window.XLSX!=='undefined' && typeof window.XLSX.read==='function'){
        return resolve(window.XLSX);
      }
      // 2) Try to re-init from make_xlsx_lib (embedded but window.XLSX not set)
      try{
        if(typeof make_xlsx_lib==='function'){
          if(typeof window.XLSX==='undefined' || !window.XLSX.read){
            var xlsxObj={};
            make_xlsx_lib(xlsxObj);
            if(typeof xlsxObj.read==='function'){
              window.XLSX=xlsxObj;
              return resolve(window.XLSX);
            }
          }
        }
      }catch(e){ /* fallthrough ke CDN */ }
      // 3) Lazy-load dari CDN sebagai fallback
      if(document.getElementById('__xlsx_cdn_script')){
        // Script CDN sudah di-inject tapi XLSX belum siap — tunggu sebentar
        var waited=0;
        var poll=setInterval(function(){
          waited+=100;
          if(typeof window.XLSX!=='undefined' && typeof window.XLSX.read==='function'){
            clearInterval(poll);
            resolve(window.XLSX);
          } else if(waited>=8000){
            clearInterval(poll);
            reject(new Error('Library XLSX dari CDN tidak berhasil dimuat. Periksa koneksi internet lalu coba lagi.'));
          }
        },100);
        return;
      }
      // Inject CDN script
      var s=document.createElement('script');
      s.id='__xlsx_cdn_script';
      s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload=function(){
        if(typeof window.XLSX!=='undefined' && typeof window.XLSX.read==='function'){
          resolve(window.XLSX);
        } else {
          reject(new Error('Library XLSX dari CDN tidak berhasil diinisialisasi.'));
        }
      };
      s.onerror=function(){
        reject(new Error('Gagal memuat library XLSX dari CDN. Periksa koneksi internet lalu coba lagi.'));
      };
      document.head.appendChild(s);
    });
  }

  return ensureXLSX().then(function(XLSXLib){
    return new Promise((res,rej)=>{
      const rd=new FileReader();
      rd.onload=e=>{
        try{
          const d=new Uint8Array(e.target.result);
          const wb=XLSXLib.read(d,{type:'array'});
          if(!wb||!wb.SheetNames||!wb.SheetNames.length) throw new Error('File Excel tidak memiliki sheet.');
          const ws=wb.Sheets[wb.SheetNames[0]];
          res(XLSXLib.utils.sheet_to_json(ws,{defval:''}));
        }catch(err){
          rej(new Error('File tidak bisa dibaca. Pastikan format .xlsx atau .xls dan coba lagi. Detail: '+err.message));
        }
      };
      rd.onerror=()=>rej(new Error('Gagal membaca file.'));
      rd.readAsArrayBuffer(file);
    });
  });
}
function validateSales(raw){
  // CATEGORY tidak wajib berisi nilai — baris tetap diproses walau kosong
  // Kolom CATEGORY wajib ADA di header, tapi boleh kosong per baris
  const req=['DEPARTEMEN','SKU','DESCRIPTION','QTY','SALES'];
  const errs=[],warns=[];
  if(!raw.length){errs.push('File kosong.');return{errs,warns,rows:[],originalCount:0};}
  const s=normK(raw[0]);
  const miss=req.filter(k=>!(k in s));
  if(miss.length){errs.push(`Kolom wajib tidak ditemukan: ${miss.join(', ')}`);return{errs,warns,rows:[],originalCount:0};}
  // CATEGORY kolom — kalau tidak ada sama sekali, warning saja, jangan error
  if(!('CATEGORY' in s))warns.push('Kolom CATEGORY tidak ditemukan — category akan dikosongkan.');
  const map={};
  let skipped=0;
  raw.forEach((r,i)=>{
    const n=normK(r);
    const dept=String(n.DEPARTEMEN||'').trim().padStart(2,'0');
    const sku=String(n.SKU||'').trim();
    // Skip hanya jika SKU benar-benar kosong
    if(!sku){skipped++;return;}
    // Dept tidak dikenal = warning saja, BUKAN skip — data tetap masuk
    if(!DEPTS[dept])warns.push(`Row ${i+2}: Dept "${dept}" tidak dikenal — data tetap disimpan.`);
    const qty=parseFloat(String(n.QTY||'0').replace(/,/g,'.'))||0;
    const sales=parseFloat(String(n.SALES||'0').replace(/,/g,'.'))||0;
    const cat=String(n.CATEGORY||'').trim(); // boleh kosong
    const key=`${dept}__${sku}`;
    if(map[key]){
      map[key].qty+=qty;
      map[key].sales+=sales;
      // Kalau category berbeda, simpan keduanya
      if(cat&&map[key].category&&cat!==map[key].category)
        warns.push(`SKU ${sku}: category berbeda ("${map[key].category}" vs "${cat}") — menggunakan yang pertama.`);
    } else {
      map[key]={department_code:dept,sku,description:String(n.DESCRIPTION||'').trim(),qty,sales,category:cat};
    }
  });
  if(skipped>0)warns.push(`${skipped} baris dilewati karena SKU kosong.`);
  return{errs,warns,rows:Object.values(map),originalCount:raw.length};
}
function validateBudget(raw){
  const errs=[],warns=[];
  if(!raw.length){errs.push('File kosong.');return{errs,warns,rows:[]};}
  const s=normK(raw[0]);
  if(!('DEPARTEMEN' in s)||!('BUDGET' in s)){errs.push('Kolom DEPARTEMEN dan BUDGET diperlukan.');return{errs,warns,rows:[]};}
  const rows=[];
  raw.forEach((r,i)=>{const n=normK(r);const dept=String(n.DEPARTEMEN||'').trim().padStart(2,'0');const bud=parseFloat(n.BUDGET)||0;if(!DEPTS[dept])warns.push(`Row ${i+2}: Dept "${dept}" tidak dikenal.`);rows.push({department_code:dept,budget_amount:bud});});
  return{errs,warns,rows,originalCount:raw.length};
}
function validateDamage(raw){
  const errs=[],warns=[];
  if(!raw.length){errs.push('File kosong.');return{errs,warns,rows:[],originalCount:0};}
  const s=normK(raw[0]);
  const hasCost='TOTAL_COST' in s||'TOTAL COST' in s;
  const miss=['DEPARTEMEN','SKU','DESCRIPTION','QTY'].filter(k=>!(k in s));
  if(!hasCost)miss.push('TOTAL COST');
  if(miss.length){errs.push(`Kolom wajib tidak ditemukan: ${miss.join(', ')}`);return{errs,warns,rows:[],originalCount:0};}
  if(!('CATEGORY' in s))warns.push('Kolom CATEGORY tidak ditemukan — category akan dikosongkan.');
  const map={};
  let skipped=0;
  raw.forEach((r,i)=>{
    const n=normK(r);
    const dept=String(n.DEPARTEMEN||'').trim().padStart(2,'0');
    const sku=String(n.SKU||'').trim();
    if(!sku){skipped++;return;}
    if(!DEPTS[dept])warns.push(`Row ${i+2}: Dept "${dept}" tidak dikenal — data tetap disimpan.`);
    const qty=parseFloat(String(n.QTY||'0').replace(/,/g,'.'))||0;
    const cost=parseFloat(String(n.TOTAL_COST||n['TOTAL COST']||'0').replace(/,/g,'.'))||0;
    const cat=String(n.CATEGORY||'').trim();
    const key=`${dept}__${sku}`;
    if(map[key]){map[key].qty+=qty;map[key].total_cost+=cost;}
    else map[key]={department_code:dept,sku,description:String(n.DESCRIPTION||'').trim(),qty,total_cost:cost,category:cat};
  });
  if(skipped>0)warns.push(`${skipped} baris dilewati karena SKU kosong.`);
  return{errs,warns,rows:Object.values(map),originalCount:raw.length};
}

// ---- EXPORT — tampil sebagai modal in-app ----
// Platform artifact memblokir download, jadi data ditampilkan di modal
// User bisa screenshot atau share link artifact untuk akses data

let _exportModal = null;

function exportXLSX(rows, cols, filename){
  // Buat modal in-app
  const title = filename.replace('.xlsx','').replace(/_/g,' ');

  // Build raw data values (unformatted numbers for copy, for accurate paste to Excel)
  const getRaw = (c, r) => {
    const v = typeof c.g==='function' ? c.g(r) : r[c.k];
    return v==null ? '' : String(v);
  };

  const thHtml = cols.map(c=>`<th style="background:var(--bg3);color:var(--tm);padding:7px 10px;text-align:left;white-space:nowrap;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--bd)">${c.l}</th>`).join('');
  const tbHtml = rows.map((r,ri)=>`<tr style="background:${ri%2===0?'var(--bgc)':'var(--bg3)'};">${
    cols.map(c=>{
      const v=typeof c.g==='function'?c.g(r):r[c.k];
      const isNum=c.num&&!isNaN(Number(v))&&v!==''&&v!==null;
      const disp=isNum?Number(v).toLocaleString('id'):String(v??'');
      return`<td style="padding:7px 10px;font-size:11px;white-space:nowrap;border-bottom:1px solid var(--bd2);${isNum?'text-align:right;font-family:monospace':'color:var(--t1)'}">${disp}</td>`;
    }).join('')
  }</tr>`).join('');

  // Build tab-separated text for clipboard (header + rows, raw values)
  const tsvHeader = cols.map(c=>c.l).join('\t');
  const tsvRows = rows.map(r=>cols.map(c=>getRaw(c,r)).join('\t')).join('\n');
  const tsvData = tsvHeader + '\n' + tsvRows;

  // Buat atau update modal
  let modal = document.getElementById('exportModal');
  if(!modal){
    modal = document.createElement('div');
    modal.id = 'exportModal';
    modal.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto';
    document.body.appendChild(modal);
  }
  modal.innerHTML = `
    <div style="background:var(--bg2);border:1px solid var(--bd);border-radius:6px;width:100%;max-width:900px;margin:auto">
      <div style="padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg2);z-index:1">
        <div style="min-width:0">
          <div style="font-size:13px;font-weight:600;color:var(--t1)">${title}</div>
          <div style="font-size:11px;color:var(--tm);margin-top:2px">${rows.length.toLocaleString('id')} baris — ${new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}</div>
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0">
          <button id="exportCopyBtn" style="background:var(--green);color:#fff;border:none;padding:7px 13px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px">
            📋 Copy ke Excel
          </button>
          <button onclick="document.getElementById('exportModal').remove()" style="background:var(--bg3);border:1px solid var(--bd);color:var(--t2);padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px">✕ Tutup</button>
        </div>
      </div>
      <div style="padding:12px 16px;background:rgba(59,130,246,.08);border-bottom:1px solid rgba(59,130,246,.2);font-size:12px;color:#93c5fd">
        💡 <strong>Cara cepat:</strong> Klik <b>📋 Copy ke Excel</b> → Buka Google Sheets / Excel → Paste (Ctrl+V). Semua kolom langsung rapi terpisah.
      </div>
      <div id="exportCopyFeedback" style="display:none;padding:8px 16px;background:rgba(5,150,105,.12);border-bottom:1px solid rgba(5,150,105,.3);font-size:12px;color:var(--green);font-weight:600">
        ✅ Berhasil disalin! ${rows.length.toLocaleString('id')} baris siap paste ke Excel/Google Sheets.
      </div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
        <table style="width:100%;border-collapse:collapse;min-width:500px">
          <thead><tr>${thHtml}</tr></thead>
          <tbody>${tbHtml}</tbody>
        </table>
      </div>
      <div style="padding:12px 16px;border-top:1px solid var(--bd);font-size:11px;color:var(--tm);text-align:center">
        Total ${rows.length.toLocaleString('id')} baris data
      </div>
    </div>`;
  modal.onclick = e => { if(e.target===modal) modal.remove(); };

  // Wire up copy button
  const copyBtn = document.getElementById('exportCopyBtn');
  if(copyBtn){
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(tsvData).then(()=>{
        const fb = document.getElementById('exportCopyFeedback');
        if(fb){ fb.style.display='block'; setTimeout(()=>{ fb.style.display='none'; }, 3500); }
        copyBtn.textContent = '✅ Tersalin!';
        setTimeout(()=>{ copyBtn.innerHTML = '📋 Copy ke Excel'; }, 2500);
      }).catch(()=>{
        // Fallback for older browsers / mobile
        const ta = document.createElement('textarea');
        ta.value = tsvData;
        ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        try{ document.execCommand('copy');
          const fb = document.getElementById('exportCopyFeedback');
          if(fb){ fb.style.display='block'; setTimeout(()=>{ fb.style.display='none'; }, 3500); }
          copyBtn.textContent = '✅ Tersalin!';
          setTimeout(()=>{ copyBtn.innerHTML = '📋 Copy ke Excel'; }, 2500);
        }catch(e){ alert('Salin manual: tekan Ctrl+A pada tabel lalu Ctrl+C'); }
        document.body.removeChild(ta);
      });
    };
  }
}

  });

  document.querySelectorAll('[data-sales-view]').forEach(el=>el.onclick=()=>{S.sales.view=el.dataset.salesView;S.sales.pg=1;re();});

  // Sales dept/search/sort/page

  if(sq){

  });

  const es=document.getElementById('exportSales');if(es)es.onclick=()=>{
    const y=S.sales.year,m=S.sales.month;
    const sales=Store.getSales(y,m),salesLY=Store.getSales(y-1,m);
    const damage=Store.getDamage(y,m);
    const tyMap=sales.reduce((a,b)=>{a[`${b.department_code}__${b.sku}`]=b;return a;},{});
    const lyMap=salesLY.reduce((a,b)=>{a[`${b.department_code}__${b.sku}`]=b;return a;},{});
    // Build damage map: key -> total_cost
    const dmgMap=damage.reduce((a,b)=>{const k=`${b.department_code}__${b.sku}`;a[k]=(a[k]||0)+Number(b.total_cost||0);return a;},{});
    const allKeys=new Set([...Object.keys(tyMap),...Object.keys(lyMap)]);
    const allRows=[...allKeys].map(key=>{
      const ty=tyMap[key],ly=lyMap[key],base=ty||ly;
      const tySales=ty?Number(ty.sales||0):0;
      const dmgCost=dmgMap[key]||0;
      const dmgPct=tySales>0&&dmgCost>0?((dmgCost/tySales)*100).toFixed(2):'';
      return{department_code:base.department_code,sku:base.sku,description:base.description,
        category:base.category||'',sales:tySales,qty:ty?Number(ty.qty||0):0,
        ly_sales:ly?Number(ly.sales||0):0,ly_qty:ly?Number(ly.qty||0):0,
        growth_pct:ty&&ly?((Number(ty.sales||0)-Number(ly.sales||0))/(Number(ly.sales||0)||1)*100).toFixed(1):'',
        damage_cost:dmgCost,damage_pct:dmgPct,
        status:!ty?'Hilang':!ly?'Baru':'Ada di TY & LY'
      };
    }).filter(r=>S.sales.dept==='all'||r.department_code===S.sales.dept);
    const rows=S.sales.view==='missing'?allRows.filter(r=>r.status==='Hilang'):allRows.filter(r=>r.status!=='Hilang');
    exportXLSX(rows,[
      {l:'SKU',k:'sku'},{l:'Description',k:'description'},
      {l:'Dept Code',k:'department_code'},{l:'Department',g:r=>DEPTS[r.department_code]||r.department_code},
      {l:'Category',k:'category'},
      {l:'TY Sales',k:'sales',num:true},{l:'TY Qty',k:'qty',num:true},
      {l:'LY Sales',k:'ly_sales',num:true},{l:'LY Qty',k:'ly_qty',num:true},
      {l:'Growth %',k:'growth_pct'},
      {l:'Damage Cost',k:'damage_cost',num:true},{l:'% Dmg',k:'damage_pct'},
      {l:'Status',k:'status'}
    ], S.sales.view==='missing'
      ? `SKU_Hilang_${MONTHS[m-1]}_${y}.xlsx`
      : `Sales_Analysis_${MONTHS[m-1]}_${y}.xlsx`
    );
  };

  // Negative
  const nd=document.querySelector('[data-neg-dept]');if(nd)nd.onchange=()=>{S.neg.dept=nd.value;S.neg.pg=1;re();};
  document.querySelectorAll('[data-sort-neg]').forEach(el=>el.onclick=()=>{const col=el.dataset.sortNeg;if(S.neg.sort===col)S.neg.dir*=-1;else{S.neg.sort=col;S.neg.dir=1;}S.neg.pg=1;re();});
  document.querySelectorAll('[data-pg-neg]').forEach(el=>el.onclick=()=>{S.neg.pg+=parseInt(el.dataset.pgNeg);re();});
  const en=document.getElementById('exportNeg');if(en)en.onclick=()=>{
    const y=S.neg.year,m=S.neg.month;
    const sales=Store.getSales(y,m),salesLY=Store.getSales(y-1,m);
    const lyMap=salesLY.reduce((a,b)=>{a[`${b.department_code}__${b.sku}`]=b;return a;},{});
    const rows=sales.map(r=>{
      const l=lyMap[`${r.department_code}__${r.sku}`];
      if(!l||Number(r.sales)>=Number(l.sales))return null;
      const gap=Number(r.sales)-Number(l.sales);
      const pct=Number(l.sales)?((gap/Number(l.sales))*100).toFixed(1):'';
      return{...r,ly_sales:Number(l.sales),sales_gap:gap,growth_pct:pct};
    }).filter(Boolean).filter(r=>S.neg.dept==='all'||r.department_code===S.neg.dept);
    exportXLSX(rows,[
      {l:'SKU',k:'sku'},{l:'Description',k:'description'},
      {l:'Dept Code',k:'department_code'},{l:'Department',g:r=>DEPTS[r.department_code]||r.department_code},
      {l:'Category',k:'category'},
      {l:'TY Sales',k:'sales',num:true},{l:'LY Sales',k:'ly_sales',num:true},
      {l:'Sales Gap',k:'sales_gap',num:true},{l:'Growth %',k:'growth_pct'}
    ], `SKU_Minus_Growth_${MONTHS[m-1]}_${y}.xlsx`);
  };

  // Damage
  const dm=document.querySelector('[data-dmg-dept]');if(dm)dm.onchange=()=>{S.dmg.dept=dm.value;S.dmg.pg=1;re();};
  document.querySelectorAll('[data-sort-dmg]').forEach(el=>el.onclick=()=>{const col=el.dataset.sortDmg;if(S.dmg.sort===col)S.dmg.dir*=-1;else{S.dmg.sort=col;S.dmg.dir=-1;}S.dmg.pg=1;re();});
  document.querySelectorAll('[data-pg-dmg]').forEach(el=>el.onclick=()=>{S.dmg.pg+=parseInt(el.dataset.pgDmg);re();});
  const edm=document.getElementById('exportDmg');if(edm)edm.onclick=()=>{
    const y=S.dmg.year,m=S.dmg.month;
    const damage=Store.getDamage(y,m).filter(r=>S.dmg.dept==='all'||r.department_code===S.dmg.dept);
    const sales=Store.getSales(y,m);
    // Build sales map to join TY Sales per SKU
    const salesMap=sales.reduce((a,b)=>{const k=`${b.department_code}__${b.sku}`;a[k]=Number(b.sales||0);return a;},{});
    const rows=damage.map(r=>{
      const tySales=salesMap[`${r.department_code}__${r.sku}`]||0;
      const dmgPct=tySales>0?((Number(r.total_cost||0)/tySales)*100).toFixed(2):'';
      return{...r,ty_sales:tySales,dmg_pct:dmgPct};
    });
    exportXLSX(rows,[
      {l:'SKU',k:'sku'},{l:'Description',k:'description'},
      {l:'Dept Code',k:'department_code'},{l:'Department',g:r=>DEPTS[r.department_code]||r.department_code},
      {l:'Category',k:'category'},
      {l:'Qty',k:'qty',num:true},{l:'Total Cost',k:'total_cost',num:true},
      {l:'Avg Cost/Unit',g:r=>r.qty?Math.round(Number(r.total_cost)/Number(r.qty)):0,num:true},
      {l:'TY Sales',k:'ty_sales',num:true},{l:'% Dmg',k:'dmg_pct'}
    ], `Damage_${MONTHS[m-1]}_${y}.xlsx`);
  };

  // Export — Damage Tanpa Sales
  const ednS=document.getElementById('exportDmgNoSales');if(ednS)ednS.onclick=()=>{
    const y=S.dmg.year,m=S.dmg.month;
    const damage=Store.getDamage(y,m).filter(r=>S.dmg.dept==='all'||r.department_code===S.dmg.dept);
    const sales=Store.getSales(y,m);
    const salesLY=Store.getSales(y-1,m);
    const salesMap=sales.reduce((a,b)=>{a[b.department_code+'__'+b.sku]=b;return a;},{});
    const salesLYMap=salesLY.reduce((a,b)=>{a[b.department_code+'__'+b.sku]=b;return a;},{});
    const noSalesRows=damage.filter(r=>!salesMap[r.department_code+'__'+r.sku]);
    const rows=noSalesRows.map(r=>{
      const skLY=salesLYMap[r.department_code+'__'+r.sku];

create index if not exists idx_hm_budget_period on hm_budget(year,month);
create index if not exists idx_hm_damage_period on hm_damage(year,month);

alter table hm_budget enable row level security;

create policy "allow_all_hm_sales" on hm_sales for all using (true) with check (true);
create policy "allow_all_hm_budget" on hm_budget for all using (true) with check (true);

      }

    };
  }
}

async function handleFile(f){
  S.upload.step=2;re();
  try{
    const raw=await parseXlsx(f);
    let v;
    if(S.upload.tab==='sales')v=validateSales(raw);
    else if(S.upload.tab==='budget')v=validateBudget(raw);
    else v=validateDamage(raw);
    S.upload.prev={...v,errors:v.errs,warnings:v.warns||[],filename:f.name};
    S.upload.step=3;
  }catch(err){
    S.upload.prev={errors:[err.message],warnings:[],rows:[],filename:f.name,originalCount:0};
    S.upload.step=3;
  }
  re();
}




// ---- PDF FUNCTIONS (global, called by onclick) ----
function _buildPDF(page, y, m, deptFilter){
  var sales=Store.getSales(y,m),salesLY=Store.getSales(y-1,m);
  var damage=Store.getDamage(y,m),budgets=Store.getBudget(y,m);
  // Apply dept filter
  if(deptFilter&&deptFilter!=='all'){
    sales=sales.filter(function(r){return r.department_code===deptFilter;});
    salesLY=salesLY.filter(function(r){return r.department_code===deptFilter;});
    damage=damage.filter(function(r){return r.department_code===deptFilter;});

    +'<a href="'+dataUri+'" download="Laporan_'+MONTHS[m-1]+'_'+y+(dept&&dept!=='all'?'_Dept'+dept:'')+'.html" class="dl-btn">⬇ Download File Laporan — '+title+'</a>'
    +'</div>';

  appEl.innerHTML=html;
  window.scrollTo(0,0);

  document.getElementById('pdfBackBtn').onclick=function(){
    appEl.innerHTML=prevHtml;
    window.scrollTo(0,0);
    bind();
  };
};;;

<script>
// ===== PWA SERVICE WORKER REGISTRATION =====
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then(reg => {
    console.log('[PWA] Service Worker registered:', reg.scope);
    // Cek update SW setiap 60 detik
    setInterval(()=>reg.update(), 60000);
    // Kalau ada SW baru yang waiting, langsung aktifkan
    reg.addEventListener('updatefound', ()=>{
      const newSW = reg.installing;
      if(!newSW) return;
      newSW.addEventListener('statechange', ()=>{
        if(newSW.state==='installed' && navigator.serviceWorker.controller){
          console.log('[PWA] Update tersedia, mengaktifkan...');
          newSW.postMessage('SKIP_WAITING');
        }
      });
    });
  }).catch(err => {
    console.warn('[PWA] Service Worker registration failed:', err);
  });
  // Reload halaman saat SW baru aktif (data terbaru akan di-pull Realtime)
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(refreshing) return;
    refreshing = true;
    console.log('[PWA] SW baru aktif, reload...');
    window.location.reload();
  });
}

// ===== PWA INSTALL PROMPT =====
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  // Tampilkan tombol install setelah app siap
  setTimeout(() => showInstallBanner(), 3000);
});

function showInstallBanner(){
  if(!deferredPrompt) return;
  if(localStorage.getItem('pwa-install-dismissed')) return;
  const banner = document.createElement('div');
  banner.id = 'pwa-install-banner';
  banner.style.cssText = `
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    background:#1e40af;color:#fff;padding:12px 20px;border-radius:12px;
    display:flex;align-items:center;gap:12px;z-index:99999;
    box-shadow:0 4px 20px rgba(0,0,0,.4);font-size:13px;font-weight:500;
    max-width:360px;width:calc(100% - 32px);
  `;
  banner.innerHTML = `
    <span style="font-size:22px">📲</span>
    <div style="flex:1">
      <div style="font-weight:700;margin-bottom:2px">Install App</div>
      <div style="opacity:.85;font-size:11px">Buka seperti aplikasi native, bisa offline</div>
    </div>
    <button onclick="installPWA()" style="
      background:#fff;color:#1e40af;border:none;padding:6px 14px;
      border-radius:8px;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap
    ">Install</button>
    <button onclick="dismissInstall()" style="
      background:none;border:none;color:#fff;cursor:pointer;font-size:18px;
      padding:0 2px;opacity:.8;line-height:1
    ">×</button>
  `;
  document.body.appendChild(banner);
}

function installPWA(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(result => {
    if(result.outcome === 'accepted') console.log('[PWA] Installed');
    deferredPrompt = null;
    const b = document.getElementById('pwa-install-banner');
    if(b) b.remove();
  });
}

function dismissInstall(){
  localStorage.setItem('pwa-install-dismissed','1');
  const b = document.getElementById('pwa-install-banner');
  if(b) b.remove();
}

window.addEventListener('appinstalled', () => {
  console.log('[PWA] App installed successfully');
  const b = document.getElementById('pwa-install-banner');
  if(b) b.remove();
});
</script>
